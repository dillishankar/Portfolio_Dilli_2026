<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Navigation</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark-theme">

    <!-- NAVBAR SECTION -->
    <nav class="custom-navbar-wrapper fixed-top" id="mainNavbar">
        <div class="container d-flex align-items-center justify-content-between">

            <!-- Left: Logo + Availability Badge -->
            <div class="d-flex align-items-center gap-3">
                <a class="navbar-logo" href="#">
                    <img src="Data/Dilli.png" alt="Logo" class="logo-img">
                </a>

                <!-- Status Badge -->
                <div class="status-badge d-none d-lg-inline-flex align-items-center gap-2">
                    <span class="status-dot"></span>
                    <span class="status-text">Available for work</span>
                </div>
            </div>

            <!-- Center: Capsule Dock Navigation (Desktop) -->
            <div class="nav-dock d-none d-md-block">
                <ul class="nav-dock-list m-0 p-0 d-flex align-items-center list-unstyled">
                    <li class="nav-dock-item">
                        <a href="#skills" class="nav-dock-link">
                            <i class="bi bi-lightning-charge"></i>
                            <span>Skills</span>
                        </a>
                    </li>
                    <li class="nav-dock-item">
                        <a href="#projects" class="nav-dock-link">
                            <i class="bi bi-folder2-open"></i>
                            <span>Projects</span>
                        </a>
                    </li>
                    <li class="nav-dock-item">
                        <a href="#experience" class="nav-dock-link">
                            <i class="bi bi-briefcase"></i>
                            <span>Experience</span>
                        </a>
                    </li>
                    <li class="nav-dock-item">
                        <a href="#certificates" class="nav-dock-link">
                            <i class="bi bi-award"></i>
                            <span>Certificate</span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Right: Action Buttons -->
            <div class="nav-actions d-flex align-items-center gap-2">

                <!-- Resume Download Button -->
                <a href="Data/Resume.pdf" download class="btn-outline-glass" title="Download Resume">
                    <i class="bi bi-file-earmark-arrow-down"></i>
                    <span class="d-none d-sm-inline">CV</span>
                </a>

                <!-- Let's Connect Button -->
                <a href="mailto:ramyarams5143@gmail.com" class="btn-mint-sm">
                    <span class="pulse-dot-sm d-inline-block d-lg-none"></span>
                    Let's Connect
                </a>

                <!-- Admin Button -->
                <a href="#admin" class="btn-admin-icon" title="Admin Login" aria-label="Admin Login">
                    <i class="bi bi-lock-fill"></i>
                </a>

                <!-- Mobile Hamburger Toggle -->
                <button class="mobile-toggle-btn d-md-none" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mobileNavMenu" aria-controls="mobileNavMenu" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <i class="bi bi-list"></i>
                </button>
            </div>

        </div>

        <!-- Mobile Glass Menu Dropdown -->
        <div class="collapse d-md-none" id="mobileNavMenu">
            <div class="container mt-2">
                <div class="glass-mobile-card">
                    <!-- Mobile Availability Status -->
                    <div
                        class="status-badge-mobile d-flex align-items-center gap-2 mb-3 pb-2 border-bottom border-secondary-subtle">
                        <span class="status-dot"></span>
                        <span class="status-text">Available for work</span>
                    </div>

                    <ul class="mobile-nav-list m-0 p-0 list-unstyled">
                        <li>
                            <a href="#skills" class="mobile-nav-link">
                                <i class="bi bi-lightning-charge"></i>
                                <span>Skills</span>
                            </a>
                        </li>
                        <li>
                            <a href="#projects" class="mobile-nav-link">
                                <i class="bi bi-folder2-open"></i>
                                <span>Projects</span>
                            </a>
                        </li>
                        <li>
                            <a href="#experience" class="mobile-nav-link">
                                <i class="bi bi-briefcase"></i>
                                <span>Experience</span>
                            </a>
                        </li>
                        <li>
                            <a href="#certificates" class="mobile-nav-link">
                                <i class="bi bi-award"></i>
                                <span>Certificate</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scroll Blur Script -->
    <script>
        window.addEventListener('scroll', function () {
            const navbar = document.getElementById('mainNavbar');
            if (window.scrollY > 20) {
                navbar.classList.add('navbar-scrolled');
            } else {
                navbar.classList.remove('navbar-scrolled');
            }
        });
    </script>
</body>

</html>
